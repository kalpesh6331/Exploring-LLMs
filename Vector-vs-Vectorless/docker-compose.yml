# Two containers: Postgres holds the benchmark results, Grafana reads them.
# Everything is provisioned as code — `docker compose up -d` and the dashboard
# is already there. No clicking through the UI.
services:
  postgres:
    image: postgres:16
    container_name: bench-postgres
    environment:
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: bench
      POSTGRES_DB: bench
    ports:
      - "5433:5432"          # 5433 on the host, so it can't clash with a local Postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bench"]
      interval: 3s
      retries: 10

  grafana:
    image: grafana/grafana:11.3.0
    container_name: bench-grafana
    depends_on:
      postgres: { condition: service_healthy }
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"      # no login screen on camera
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
